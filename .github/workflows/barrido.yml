name: Barrido completo

# Revisa TODOS los anuncios publicados en las webs vigiladas (no solo los nuevos), siguiendo las páginas
# 2, 3… de cada listado, y envía a Telegram los que encajan con vuestros filtros y aún no se habían enviado.
# Al final llega un resumen con los motivos de descarte, para afinar los criterios en config.yaml.
on:
  workflow_dispatch:
    inputs:
      reenviar:
        description: "¿Reenviar también los pisos que ya se enviaron antes? (sí / no)"
        required: false
        default: "no"

concurrency:
  group: barrido
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  barrido:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - name: Esperar a que el rastreador de 5 minutos se aparte
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # El rastreador comprueba antes de cada pasada si hay un barrido y, si lo hay, se detiene.
          for i in $(seq 1 40); do
            n=$(gh run list --workflow rastreador.yml --status in_progress --limit 5 --json databaseId --jq 'length')
            [ "$n" = "0" ] && exit 0
            echo "El rastreador sigue en marcha; esperando…"; sleep 30
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar todos los anuncios publicados
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONTACTO_DATOS: ${{ secrets.CONTACTO_DATOS }}
          REENVIAR: ${{ inputs.reenviar }}
        run: |
          if echo "$REENVIAR" | grep -qiE '^(s|sí|si|yes|y)$'; then
            python rastreador.py --barrido --reenviar --sin-escuchar
          else
            python rastreador.py --barrido --sin-escuchar
          fi

      - name: Guardar estado y resultado del barrido
        if: always()
        run: |
          git config user.name "rastreador-pisos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado/
          git diff --cached --quiet || (git commit -m "Barrido completo" && git pull --rebase && git push)

      - name: Volver a poner en marcha el rastreador de 5 minutos
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rastreador.yml --ref "${{ github.ref_name }}"
