name: Rastreador de pisos

on:
  schedule:
    - cron: "*/5 * * * *"     # cada 5 minutos (GitHub puede retrasarlo unos minutos en horas punta)
  workflow_dispatch:           # botón "Run workflow" para lanzarlo a mano

concurrency:
  group: rastreador
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar webs de agencias
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Tus datos para los formularios (JSON). Cifrados por GitHub; el bot los oculta en los registros.
          CONTACTO_DATOS: ${{ secrets.CONTACTO_DATOS }}
        run: python rastreador.py

      - name: Guardar anuncios ya vistos
        run: |
          git config user.name "rastreador-pisos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado/
          git diff --cached --quiet || (git commit -m "Actualiza estado del rastreador" && git pull --rebase && git push)
