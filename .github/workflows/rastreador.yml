name: Rastreador de pisos

# GitHub no respeta un cron de 5 minutos (en repositorios nuevos lo retrasa horas), así que una sola
# ejecución se queda trabajando ~5 h 30 min: revisa las webs cada 5 minutos y, entre revisión y revisión,
# atiende los botones «Enviar mis datos». Al acabar lanza la siguiente ella misma.
# El cron de cada hora es solo un seguro por si la cadena se cortara.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:           # botón "Run workflow" para lanzarlo a mano

concurrency:
  group: rastreador
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay un barrido completo en marcha?
        id: barrido
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --workflow barrido.yml --limit 5 --json status \
              --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          echo "activo=$n" >> "$GITHUB_OUTPUT"
          [ "$n" = "0" ] || echo "Hay un barrido en marcha: esta ejecución no hace nada (el barrido relanzará el rastreador)"

      - uses: actions/setup-python@v5
        if: steps.barrido.outputs.activo == '0'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.barrido.outputs.activo == '0'
        run: pip install -r requirements.txt

      - name: Revisar webs de agencias cada 5 minutos
        id: bucle
        if: steps.barrido.outputs.activo == '0'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Tus datos para los formularios (JSON). Cifrados por GitHub; el bot los oculta en los registros.
          CONTACTO_DATOS: ${{ secrets.CONTACTO_DATOS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "rastreador-pisos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          python rastreador.py --bucle 330
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guardar anuncios ya vistos
        if: always() && steps.barrido.outputs.activo == '0'
        run: |
          git add estado/
          git diff --cached --quiet || (git commit -m "Actualiza estado del rastreador" && git pull --rebase && git push) || true

      - name: Lanzar la siguiente ejecución
        # código 3 = se ha apartado para dejar paso a un barrido completo, que lo relanzará al terminar
        if: ${{ !cancelled() && steps.barrido.outputs.activo == '0' && steps.bucle.outputs.codigo != '3' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rastreador.yml --ref "${{ github.ref_name }}"
