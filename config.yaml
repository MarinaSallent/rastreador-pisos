# Filtros de búsqueda. Cambia lo que quieras y haz commit: el siguiente ciclo ya lo usa.
filtros:
  metros_minimos: 60
  precio_maximo: 1000        # €/mes
  # Solo viviendas: si el título o la dirección del anuncio dice local, oficina, nave, parking, trastero,
  # terreno, edificio, habitación, traspaso, temporada o turístico, se descarta.
  solo_viviendas: true
  # true = solo avisa si el anuncio (o su ficha) dice que está en uno de tus barrios. Si no lo dice, se descarta.
  # false = avisarlo igualmente, marcado con ⚠️.
  zona_obligatoria: true
  # true = descartar los anuncios sin precio (ni en la tarjeta ni en la ficha).
  precio_obligatorio: true
  # Si el anuncio cumple todo lo demás pero no dice los metros: true = avisar marcado con ⚠️.
  avisar_si_faltan_metros: true

