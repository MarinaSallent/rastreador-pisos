# Palabras que descartan un anuncio aunque coincida una zona
# (evita falsos positivos como "Sant Martí Sarroca" o "Sant Andreu de la Barca").
exclusiones:
  - sant marti sarroca
  - sant andreu de la barca
  - sant andreu de llavaneres
  - traspaso
  - traspas
  - local comercial
  - plaza de parking
  - plaça d'aparcament
  # Las ventas se descartan solas: cualquier precio por encima de 10.000 € se trata como venta.

# Códigos postales de tus distritos (aprox.). Si el anuncio muestra uno, cuenta como zona válida.
