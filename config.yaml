# Filtros de búsqueda. Cambia lo que quieras y haz commit: el siguiente ciclo ya lo usa.
filtros:
  metros_minimos: 60
  precio_maximo: 1000        # €/mes
  # Si el anuncio no dice el barrio: true = avisar igualmente (marcado con ⚠️) cuando la agencia tiene la
  # oficina en tus distritos (columna en_tus_zonas = sí). Si la agencia está en otra zona, un anuncio sin
  # barrio se descarta siempre, para no llenarte de avisos de pisos en Sants o Badalona.
  avisar_si_zona_desconocida: true
  # Si el anuncio no indica precio o metros: true = avisar igualmente (marcado con ⚠️).
  avisar_si_faltan_datos: true

# Palabras que identifican tus zonas (sin importar mayúsculas ni acentos).
