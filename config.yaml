rastreo:
  # Si la ficha del anuncio no muestra precio/metros en el listado, abrir la ficha (más lento pero más preciso).
  abrir_fichas: true
  max_fichas_por_agencia: 15
  # Agencias nuevas en la lista: true = la primera vez se revisan TODOS sus anuncios publicados y se envían los
  # que encajan; false = la primera vez solo se memorizan y se avisa de los que salgan después.
  avisar_existentes_al_empezar: true
  # Agencias nuevas que se revisan a fondo en cada pasada de 5 minutos (el resto espera a la siguiente).
  agencias_nuevas_por_ciclo: 8
  # Barrido completo (Actions → «Barrido completo») y primera revisión: páginas del listado y fichas por agencia.
  max_paginas_barrido: 10
  max_fichas_barrido: 150
  timeout_segundos: 20
  # Si la web de una agencia falla N veces seguidas, entra en el resumen diario de las 18:30 (sección horario).
  # A partir de ahí esa web se prueba solo 1 de cada 6 pasadas, para no insistir sobre una web caída o que nos bloquea.
  avisar_tras_fallos: 6
  # Tras cada revisión, el bot se queda atento a los botones «Enviar mis datos» hasta la siguiente.
  escuchar_botones_segundos: 240
  # Si una agencia no publica ningún piso nuevo en este tiempo, se deja de vigilar y se avisa para
  # contactarla en persona (queda en estado/a_contactar.json). 0 = vigilar siempre.
  dias_sin_novedades: 180

# Ritmo de revisión (hora de Madrid). En horario comercial cada 5 minutos; de noche cada 30 y los pisos
# que aparezcan se guardan y llegan todos juntos a Telegram a las 8:00 (para no despertar a nadie).
horario:
  zona: Europe/Madrid
  inicio: 8
  fin: 20
  intervalo_minutos: 5
  intervalo_noche_minutos: 30
  # Hora del resumen diario de webs que fallan (en vez de un aviso suelto por cada una).
  resumen_problemas: "18:30"
